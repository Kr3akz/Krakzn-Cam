# XcodeGen-Projektbeschreibung. Daraus wird auf dem Mac in der Cloud das Xcode-Projekt erzeugt:
#   xcodegen generate
name: KrakznCam
options:
  bundleIdPrefix: de.krakzncam
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KrakznCam:
    type: application
    platform: iOS
    sources:
      - path: KrakznCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.krakzncam.KrakznCam
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  KrakznCam:
    build:
      targets:
        KrakznCam: all
    run:
      config: Debug
    archive:
      config: Release
