# Baut die iPhone-App auf einem Mac in der Cloud (ohne Signatur).
# Ergebnis: KabelCam-unsigned.ipa als Artefakt. Installieren mit Sideloadly (signiert mit deiner Apple-ID).
name: iPhone-App bauen

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate

      - name: App bauen (unsigniert)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -quiet \
            -project KabelCam.xcodeproj \
            -scheme KabelCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA verpacken
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KabelCam.app Payload/
          zip -qry KabelCam-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KabelCam-ipa
          path: ios/KabelCam-unsigned.ipa
          if-no-files-found: error
