# Baut das Windows-Programm in der Cloud. Niemand muss dafür Visual Studio installieren.
# Ergebnis: Artefakt "KrakznCam-Windows" mit krakzncam.exe, der virtuellen Kamera krakzncam_vcam.dll
# und den Prüfwerkzeugen (Testquelle, Kamera-Test).
name: Windows-Programm bauen

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -S windows -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/*.exe dist/
          if (Test-Path build/Release/*.dll) { Copy-Item build/Release/*.dll dist/ }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: KrakznCam-Windows
          path: dist/
          if-no-files-found: error
